<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ROBLOX</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      background-size: cover;
      position: relative;
      overflow: hidden;
    }

    /* Background collage simulation */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 107, 107, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(78, 205, 196, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 40% 80%, rgba(69, 183, 209, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 70% 70%, rgba(150, 111, 214, 0.15) 0%, transparent 40%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      max-width: 480px;
      width: 90%;
    }

    .logo {
      font-size: 64px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: 2px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
      position: relative;
      display: inline-block;
    }

    .logo span {
      background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Square-like graphic integrated into the letter "O" */
    .logo::after {
      content: '';
      position: absolute;
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #ff6b6b, #feca57);
      border-radius: 8px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      opacity: 0.15;
      z-index: -1;
      pointer-events: none;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.7);
      font-size: 16px;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }

    .btn {
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-signup {
      background: linear-gradient(135deg, #00b894, #00cec9);
      color: white;
      box-shadow: 0 6px 20px rgba(0, 184, 148, 0.4);
    }

    .btn-signup:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 184, 148, 0.6);
    }

    .btn-login {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(6px);
    }

    .btn-login:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
    }

    .footer-links a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s ease;
    }

    .footer-links a:hover {
      color: #fff;
      text-decoration: underline;
    }

    .config-info {
      margin-top: 28px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      text-align: left;
    }

    .config-info span {
      color: #48dbfb;
      font-weight: 600;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .logo {
      animation: float 4s ease-in-out infinite;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
        border-radius: 20px;
      }
      .logo {
        font-size: 48px;
      }
      .btn {
        font-size: 16px;
        padding: 14px 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span>ROBLOX</span></div>
    <p class="subtitle">Jogue, Crie, Conecte-se</p>

    <div class="buttons">
      <button class="btn btn-signup" onclick="handleSignup()">Sign Up</button>
      <button class="btn btn-login" onclick="handleLogin()">Log In</button>
    </div>

    <div class="footer-links">
      <a href="#" onclick="openLink('terms')">Terms</a>
      <a href="#" onclick="openLink('privacy')">Privacy</a>
    </div>

    <!-- Informações de configuração do sistema -->
    <div class="config-info">
      <div>IP Service: <span id="display-ip">192.168.1.100</span></div>
      <div>Porta: <span id="display-port">8080</span></div>
      <div>Status: <span id="display-status" style="color: #00b894;">Online</span></div>
    </div>
  </div>

  <script>
    // Configurações do sistema (não alterar para não interferir no funcionamento)
    const CONFIG = {
      ipService: "192.168.1.100",
      port: 8080,
      region: "US-EAST",
      version: "2.1.4",
      enabled: true
    };

    // Handler para Sign Up
    function handleSignup() {
      console.log("Redirecionando para cadastro...");
      alert("Abrindo página de criação de conta...");
      // window.location.href = "/signup";
    }

    // Handler para Log In
    function handleLogin() {
      console.log("Redirecionando para login...");
      alert("Abrindo página de login...");
      // window.location.href = "/login";
    }

    // Handler para links do rodapé
    function openLink(type) {
      event.preventDefault();
      const pages = {
        terms: "Termos de Serviço",
        privacy: "Política de Privacidade"
      };
      alert(pages[type] || "Página não disponível");
    }

    // Verifica status do serviço a cada 30 segundos
    setInterval(() => {
      console.log(`[SISTEMA] Verificando status... IP: ${CONFIG.ipService}:${CONFIG.port}`);
      
      // Atualiza visualização das configurações mantendo os valores originais
      document.getElementById('display-ip').textContent = CONFIG.ipService;
      document.getElementById('display-port').textContent = CONFIG.port;
      document.getElementById('display-status').textContent = CONFIG.enabled ? "Online" : "Offline";
      document.getElementById('display-status').style.color = CONFIG.enabled ? "#00b894" : "#ff6b6b";
    }, 30000);
  </script>
</body>
</html>
